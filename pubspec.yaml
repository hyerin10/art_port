name: art_port
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  file_picker: 10.3.8
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^10.3.1
  flutter_staggered_grid_view: ^0.7.0
  gal: ^2.3.2
  google_sign_in: ^6.2.2
  http: ^1.6.0
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/art_port_icon.png
  adaptive_icon_background: "#FDFBF7"
  adaptive_icon_foreground: assets/branding/art_port_icon_foreground.png
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FDFBF7"
  image: assets/branding/art_port_splash_logo.png
  android_gravity: center
  ios: true
  android: true
  web: false
  android_12:
    color: "#FDFBF7"
    image: assets/branding/art_port_splash_logo.png
    icon_background_color: "#FDFBF7"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
